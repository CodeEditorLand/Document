[[bin]]
name = "Document"
path = "Source/Fn/Binary/Document.rs"

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "0.9.11" }

[dependencies]
clap = { version = "4.5.54", features = ["cargo"] }
proc_use = { version = "0.2.1" }
rayon = { version = "1.11.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
toml = { version = "0.9.11" }

[lib]
name = "Library"
path = "Source/Library.rs"

[package]
autobenches = false
autobins = false
autoexamples = false
autotests = false
default-run = "Document"
documentation = "https://Documentation.Document.Editor.Land"
edition = "2024"
homepage = "https://Document.Editor.Land"
license-file = "LICENSE"
name = "Document"
publish = false
repository = "https://github.com/CodeEditorLand/Document"
version = "0.0.1"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-apple-darwin",
	"aarch64-apple-darwin",
]
